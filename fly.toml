# fly.toml app configuration file generated for debvm on 2026-09-29T01:17:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'debvm'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
